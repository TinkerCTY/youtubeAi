name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test + Build + Deploy (Cloudflare Worker + Assets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (workspaces)
        run: npm ci || npm install

      - name: Type check Worker
        run: npm exec --workspace worker -- tsc --noEmit

      - name: Run Worker Tests (TDD cases)
        run: npm test --workspace worker

      - name: Build Frontend (Vite → web/dist)
        run: npm run build --workspace web

      - name: Type check Web
        run: npm exec --workspace web -- tsc --noEmit

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '3'
          # 把 GEMINI_API_KEY 注入为 Worker Secret（部署前由 Wrangler 写入）
          secrets: |
            GEMINI_API_KEY
            PROXY_URL
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
