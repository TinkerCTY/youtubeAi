<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube AI 对话文章生成器</title>
    <style>
      :root {
        --bg: #ffffff;
        --card: #ffffff;
        --card-alt: #f7faf0;
        --border: #e5e7eb;
        --input-border: #e0e0e6;
        --text: #334155;
        --muted: #64748b;
        --brand: #07c16c;
        --btn-green: #45c26b;
        --btn-green-hover: #3aa855;
        --light-green: #e8f5ee;
        --error: #ef4444;
        --error-bg: #fef2f2;
        --error-border: #fecaca;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        font-size: 15px;
      }

      /* ── 顶部导航 ── */
      .nav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255,255,255,.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .nav-inner {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 1.25rem;
        height: 56px;
        display: flex;
        align-items: center;
        gap: .4rem;
      }
      .nav-logo {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--brand);
        text-decoration: none;
      }
      .nav-badge {
        font-size: .65rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: .1rem .35rem;
        font-weight: 400;
      }

      /* ── 主容器 ── */
      .container {
        max-width: 760px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.9rem;
        font-weight: 700;
        margin-bottom: .35rem;
        letter-spacing: -.01em;
      }
      h1 .brand-text { color: var(--brand); }
      .hint {
        color: var(--muted);
        font-size: .88rem;
        margin-top: 0;
      }

      /* ── 步骤指示器 ── */
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: .75rem;
        margin: 1.5rem 0;
        background: var(--light-green);
        border-radius: 8px;
        padding: 1rem .75rem;
      }
      .step {
        display: flex;
        align-items: center;
        gap: .5rem;
        padding: .25rem .5rem;
      }
      .step-num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .8rem;
        font-weight: 700;
        color: var(--text);
        flex-shrink: 0;
      }
      .step:nth-child(1) .step-num { background: #ffee5d; }
      .step:nth-child(2) .step-num { background: #3cef8a; }
      .step:nth-child(3) .step-num { background: #5db5f9; color: #fff; }
      .step-text {
        font-size: .75rem;
        color: var(--text);
        line-height: 1.4;
      }

      /* ── 表单 ── */
      .gen-form {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
        margin: 0 0 2rem;
        box-shadow: 0 1px 3px rgba(0,0,0,.04);
      }
      .field { display: block; margin-bottom: .85rem; }
      .field span {
        display: block;
        font-size: .8rem;
        color: var(--muted);
        margin-bottom: .3rem;
        font-weight: 500;
      }
      .field input, .field textarea {
        width: 100%;
        padding: .65rem .75rem;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        font-size: .95rem;
        font-family: inherit;
        background: #fff;
        transition: border-color .2s, box-shadow .2s;
      }
      .field input:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(7, 193, 108, .1);
      }
      .advanced { margin-top: .85rem; }
      .advanced summary {
        cursor: pointer;
        font-size: .82rem;
        color: var(--muted);
        font-weight: 500;
      }
      .advanced[open] { padding-top: .5rem; }

      button[type="submit"] {
        background: var(--btn-green);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: .7rem 1.5rem;
        font-size: .95rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        width: 100%;
        margin-top: .5rem;
        transition: background .2s;
      }
      button[type="submit"]:hover:not(:disabled) { background: var(--btn-green-hover); }
      button[type="submit"]:disabled { opacity: .5; cursor: wait; }

      /* ── 文章区域 ── */
      .article { margin-top: 1.5rem; }
      .chapter {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem 1.5rem;
        margin-bottom: 1rem;
        box-shadow: 0 1px 3px rgba(0,0,0,.04);
      }
      .chapter-header {
        display: flex;
        align-items: center;
        gap: .6rem;
        padding-bottom: .65rem;
        border-bottom: 1px solid var(--border);
        margin-bottom: .85rem;
      }
      .chapter-title {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 0;
        flex: 1;
      }
      .summary-btn {
        background: var(--light-green);
        color: var(--brand);
        border: 1px solid #c8ecd8;
        border-radius: 6px;
        padding: .18rem .55rem;
        font-size: .74rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: background .2s;
      }
      .summary-btn:hover:not(:disabled) { background: #d4f0dd; }
      .summary-btn:disabled { opacity: .5; }
      .summary-error-tip {
        color: var(--error);
        font-size: .74rem;
      }
      .chapter-body {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: .92rem;
        line-height: 1.85;
      }

      /* ── 5W1H 卡片 ── */
      .summary-card {
        margin-top: 1rem;
        background: var(--card-alt);
        border: 1px solid #d4ead4;
        border-radius: 8px;
        padding: 1rem 1.25rem;
      }
      .summary-row {
        display: grid;
        grid-template-columns: 5.5rem 1fr;
        gap: .5rem;
        padding: .35rem 0;
        border-bottom: 1px solid #e0eee0;
      }
      .summary-row:last-child { border-bottom: none; }
      .summary-key {
        font-weight: 700;
        color: var(--brand);
        font-size: .82rem;
      }
      .summary-value {
        font-size: .88rem;
        line-height: 1.6;
      }

      /* ── 错误提示 ── */
      .error-msg {
        color: var(--error);
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        border-radius: 8px;
        padding: .85rem 1rem;
        font-size: .9rem;
      }

      /* ── 页脚 ── */
      .footer {
        background: #1a805a;
        color: #fff;
        text-align: center;
        padding: 2rem 1.25rem;
        font-size: .8rem;
        line-height: 1.8;
      }
      .footer a { color: #fff; text-decoration: none; }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="nav-inner">
        <a href="/" class="nav-logo">YouTube AI</a>
        <span class="nav-badge">Beta</span>
      </div>
    </nav>

    <main class="container">
      <h1>YouTube AI <span class="brand-text">对话文章</span>生成器</h1>
      <p class="hint">输入一个有字幕的 YouTube 视频链接，AI 将基于字幕生成一篇中文对话内容文章。</p>

      <div class="steps">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text">复制 YouTube 视频链接</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">粘贴链接并点击生成</div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">阅读 AI 生成的对话文章</div>
        </div>
      </div>

      <form id="gen-form" class="gen-form">
        <label class="field">
          <span>YouTube 视频链接</span>
          <input
            id="video-url"
            name="videoUrl"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          />
        </label>

        <details class="advanced">
          <summary>生成要求（可选）</summary>
          <label class="field">
            <span>任务类型</span>
            <input name="taskType" placeholder="如：总结 / 改写为对话" />
          </label>
          <label class="field">
            <span>输出风格</span>
            <input name="style" placeholder="如：口语化 / 专业" />
          </label>
          <label class="field">
            <span>目标受众</span>
            <input name="audience" placeholder="如：普通读者 / 行业人" />
          </label>
          <label class="field">
            <span>约束条件</span>
            <input name="constraints" placeholder="如：不超过 1500 字" />
          </label>
        </details>

        <button type="submit" id="gen-btn">生成对话文章</button>
      </form>

      <section id="article" class="article" aria-live="polite"></section>
    </main>

    <footer class="footer">
      Powered by Cloudflare Worker + Gemini AI · <a href="https://github.com/TinkerCTY/youtubeAi">GitHub</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
